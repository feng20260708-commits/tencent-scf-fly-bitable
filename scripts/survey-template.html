<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷模板</title>
  <style>
    body { font-family: system-ui, "PingFang SC", sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; background: #3370ff; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .msg { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; }
    .ok { background: #e7f7ec; color: #1a7f37; }
    .err { background: #fde8e8; color: #c0392b; }
  </style>
</head>
<body>
  <h2>问卷模板（可改为你的问卷内容）</h2>

  <!-- 每个输入用 name 作为 payload key，后端 FIELD_MAP 按这个 key 映射飞书字段 -->
  <label>企业名称 *</label>
  <input name="company_name" data-field="company_name" placeholder="必填" />

  <label>联系电话 *</label>
  <input name="contact_phone" data-field="contact_phone" placeholder="必填，11 位手机号" />

  <label>需求标签（逗号分隔即视为多选）</label>
  <input name="tags" data-field="tags" placeholder="如：AI漫剧, 数字化SaaS" />

  <button id="submitBtn">提交</button>
  <div id="msg" class="msg"></div>

  <script>
    // 联调时填 http://localhost:8080；上线换成云函数公网 HTTPS 地址
    var API_BASE = 'http://localhost:8080';

    function collectData() {
      var data = {};
      document.querySelectorAll('[data-field]').forEach(function (el) {
        var key = el.getAttribute('data-field');
        var val = el.value.trim();
        if (!val) return;
        // 含逗号视为多选数组（也可改成多个 checkbox）
        data[key] = val.indexOf(',') > -1 ? val.split(',').map(function (s) { return s.trim(); }) : val;
      });
      return data;
    }

    document.getElementById('submitBtn').addEventListener('click', function () {
      var data = collectData();
      // 手机号格式校验示例
      if (data.contact_phone && !/^1[3-9]\d{9}$/.test(data.contact_phone)) {
        return show('手机号格式不正确', false);
      }
      fetch(API_BASE + '/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) show('提交成功！recordId: ' + res.recordId, true);
          else show('提交失败：' + res.error, false);
        })
        .catch(function (e) { show('网络错误：' + e.message, false); });
    });

    function show(text, ok) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.style.display = 'block';
    }
  </script>
</body>
</html>
